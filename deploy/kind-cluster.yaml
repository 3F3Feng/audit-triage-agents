kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  # kindnet (the default CNI) does not enforce NetworkPolicy. Disable it and install Calico so the
  # policies in k8s/networkpolicy.yaml are actually enforced. podSubnet matches Calico's default.
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
