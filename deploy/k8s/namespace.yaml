apiVersion: v1
kind: Namespace
metadata:
  name: audit-triage
  labels:
    # Enforce the Pod Security "restricted" profile: no root, no privilege escalation,
    # dropped capabilities, seccomp RuntimeDefault. Non-compliant pods are rejected.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
