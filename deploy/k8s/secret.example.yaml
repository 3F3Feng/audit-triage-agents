# DO NOT put a real key in a file and commit it. A Secret's stringData is only base64 in etcd,
# not encrypted. Create it imperatively instead, straight from your .env value:
#
#   kubectl -n audit-triage create secret generic audit-triage-secret \
#     --from-literal=TRIAGE_API_KEY="$TRIAGE_API_KEY"
#
# (The Makefile's `make secret` does exactly this.) This file documents the shape only.
apiVersion: v1
kind: Secret
metadata:
  name: audit-triage-secret
  namespace: audit-triage
type: Opaque
stringData:
  TRIAGE_API_KEY: "replace-me-do-not-commit"
