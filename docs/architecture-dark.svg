<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 668" width="920" height="668"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Architecture: the CLI calls FastAPI, whose assessment and triage endpoints both rest on a deterministic facts layer. From there a fast Jev lane produces typed per-actor judgments that code thresholds turn into an action, while the CrewAI crew produces the Markdown report; the policy analyst can call Jev as a tool.">
<title>audit-triage-agents architecture (dark)</title>
<rect width="920" height="668" fill="#222A2F"/>
<g transform="translate(20,20)">
        <defs>
          <marker id="g1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93A0A7"/></marker>
          <marker id="g1b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4DBCB1"/></marker>
        </defs>

        <rect x="20" y="34" width="130" height="54" rx="4" fill="#222A2F" stroke="#354047" stroke-width="1.3"/>
        <text x="85" y="58" text-anchor="middle" fill="#E6EBEE" font-weight="600" font-size="12.5">TypeScript CLI</text>
        <text x="85" y="75" text-anchor="middle" fill="#93A0A7" font-size="10">health · summary · assess · triage</text>
        <path d="M150,61 H190" marker-end="url(#g1a)" fill="none" stroke="#93A0A7" stroke-width="1.4"/>

        <rect x="196" y="12" width="664" height="104" rx="6" fill="none" stroke="#354047" stroke-width="1.2" stroke-dasharray="3 3"/>
        <text x="208" y="32" fill="#93A0A7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="0.07em">FASTAPI · server.py</text>
        <rect x="208" y="50" width="86" height="54" rx="4" fill="#222A2F" stroke="#354047" stroke-width="1.3"/>
        <text x="251" y="81" text-anchor="middle" font-size="10" fill="#E6EBEE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">/health</text>
        <rect x="304" y="50" width="96" height="54" rx="4" fill="#222A2F" stroke="#354047" stroke-width="1.3"/>
        <text x="352" y="81" text-anchor="middle" font-size="10" fill="#E6EBEE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">/policies</text>
        <rect x="410" y="50" width="150" height="54" rx="4" fill="#222A2F" stroke="#354047" stroke-width="1.3"/>
        <text x="485" y="73" text-anchor="middle" font-size="10" fill="#E6EBEE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">/events/summary</text>
        <text x="485" y="90" text-anchor="middle" fill="#93A0A7" font-size="10">no model</text>
        <rect x="570" y="50" width="168" height="54" rx="4" fill="#12312F" stroke="#4DBCB1" stroke-width="1.6"/>
        <text x="654" y="73" text-anchor="middle" font-size="10" fill="#4DBCB1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">/actors/assessment</text>
        <text x="654" y="90" text-anchor="middle" fill="#4DBCB1" font-size="10">Jev lane · ~1.1s</text>
        <rect x="748" y="50" width="100" height="54" rx="4" fill="#222A2F" stroke="#354047" stroke-width="1.3"/>
        <text x="798" y="73" text-anchor="middle" font-size="10" fill="#E6EBEE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">/triage</text>
        <text x="798" y="90" text-anchor="middle" fill="#93A0A7" font-size="10">crew · ~100s</text>

        <path d="M654,116 V136" marker-end="url(#g1a)" fill="none" stroke="#93A0A7" stroke-width="1.4"/>
        <path d="M798,116 V136" marker-end="url(#g1a)" fill="none" stroke="#93A0A7" stroke-width="1.4"/>

        <rect x="20" y="150" width="150" height="48" rx="4" fill="#222A2F" stroke="#354047" stroke-width="1.3"/>
        <text x="95" y="171" text-anchor="middle" font-size="10" fill="#E6EBEE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">audit events</text>
        <text x="95" y="187" text-anchor="middle" fill="#93A0A7" font-size="10">.jsonl</text>
        <path d="M170,174 H190" marker-end="url(#g1a)" fill="none" stroke="#93A0A7" stroke-width="1.4"/>

        <rect x="196" y="140" width="664" height="98" rx="6" fill="none" stroke="#354047" stroke-width="1.2" stroke-dasharray="3 3"/>
        <text x="208" y="160" fill="#93A0A7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="0.07em">DETERMINISTIC CODE — decides the FACTS</text>
        <rect x="208" y="170" width="316" height="56" rx="4" fill="#222A2F" stroke="#354047" stroke-width="1.3"/>
        <text x="366" y="192" text-anchor="middle" font-size="10.5" fill="#E6EBEE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">tools/policy.py</text>
        <text x="366" y="210" text-anchor="middle" fill="#93A0A7" font-size="10">VIOLATION vs PERMISSION_ERROR, per event</text>
        <rect x="534" y="170" width="314" height="56" rx="4" fill="#222A2F" stroke="#354047" stroke-width="1.3"/>
        <text x="691" y="192" text-anchor="middle" font-size="10.5" fill="#E6EBEE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">LangChain @tool layer</text>
        <text x="691" y="210" text-anchor="middle" fill="#93A0A7" font-size="10">counts · violation_rate · org_baseline</text>

        <path d="M420,238 V268 H346 V292" marker-end="url(#g1b)" fill="none" stroke="#4DBCB1" stroke-width="1.7"/>
        <text x="390" y="283" text-anchor="middle" fill="#4DBCB1" font-size="10">facts as state</text>
        <path d="M654,238 V268 H700 V292" marker-end="url(#g1a)" fill="none" stroke="#93A0A7" stroke-width="1.4"/>
        <text x="742" y="283" text-anchor="middle" fill="#93A0A7" font-size="10">tool calls</text>

        <!-- Jev lane -->
        <rect x="196" y="300" width="300" height="190" rx="6" fill="none" stroke="#354047" stroke-width="1.2" stroke-dasharray="3 3"/>
        <text x="208" y="320" fill="#4DBCB1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="0.07em">TYPESAFE JEV — decides the MEANING</text>
        <rect x="208" y="330" width="276" height="72" rx="4" fill="#12312F" stroke="#4DBCB1" stroke-width="1.6"/>
        <text x="346" y="353" text-anchor="middle" fill="#E6EBEE" font-weight="600" font-size="12.5">one call per actor</text>
        <text x="346" y="372" text-anchor="middle" fill="#93A0A7" font-size="10">Choice — why are they failing? (4 options)</text>
        <text x="346" y="389" text-anchor="middle" fill="#93A0A7" font-size="10">Score — how concerning? (0–3)</text>
        <path d="M346,402 V424" marker-end="url(#g1b)" fill="none" stroke="#4DBCB1" stroke-width="1.7"/>
        <rect x="208" y="428" width="276" height="52" rx="4" fill="#222A2F" stroke="#354047" stroke-width="1.3"/>
        <text x="346" y="450" text-anchor="middle" font-size="11.5" fill="#E6EBEE">typed answers + probabilities</text>
        <text x="346" y="467" text-anchor="middle" fill="#93A0A7" font-size="10">never asked for the facts</text>

        <path d="M346,490 V518" marker-end="url(#g1b)" fill="none" stroke="#4DBCB1" stroke-width="1.7"/>
        <rect x="196" y="522" width="300" height="88" rx="4" fill="#12312F" stroke="#4DBCB1" stroke-width="1.6"/>
        <text x="208" y="542" fill="#4DBCB1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="0.07em">CODE — decides the ACTION</text>
        <text x="346" y="563" text-anchor="middle" font-size="10.5" fill="#E6EBEE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">decide_action()</text>
        <text x="346" y="581" text-anchor="middle" fill="#93A0A7" font-size="10">≥2.5 escalate · ≥1.5 follow_up · else note</text>
        <text x="346" y="598" text-anchor="middle" fill="#93A0A7" font-size="10">either confidence &lt; 0.5 → human_review</text>

        <!-- crew lane -->
        <rect x="540" y="300" width="320" height="256" rx="6" fill="none" stroke="#354047" stroke-width="1.2" stroke-dasharray="3 3"/>
        <text x="552" y="320" fill="#93A0A7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="0.07em">CREWAI CREW — SYNTHESIS</text>
        <rect x="552" y="330" width="296" height="52" rx="4" fill="#222A2F" stroke="#354047" stroke-width="1.3"/>
        <text x="700" y="352" text-anchor="middle" fill="#E6EBEE" font-weight="600" font-size="12.5">① Event Summarizer</text>
        <text x="700" y="369" text-anchor="middle" fill="#93A0A7" font-size="10">gathers, never judges</text>
        <path d="M700,382 V396" marker-end="url(#g1a)" fill="none" stroke="#93A0A7" stroke-width="1.4"/>
        <rect x="552" y="400" width="296" height="68" rx="4" fill="#222A2F" stroke="#354047" stroke-width="1.3"/>
        <text x="700" y="421" text-anchor="middle" fill="#E6EBEE" font-weight="600" font-size="12.5">② Policy Analyst</text>
        <text x="700" y="439" text-anchor="middle" fill="#93A0A7" font-size="10">ranks the actors itself</text>
        <text x="700" y="456" text-anchor="middle" fill="#93A0A7" font-size="10">must state where it disagrees with Jev</text>
        <path d="M700,468 V486" marker-end="url(#g1a)" fill="none" stroke="#93A0A7" stroke-width="1.4"/>
        <rect x="552" y="490" width="296" height="52" rx="4" fill="#222A2F" stroke="#354047" stroke-width="1.3"/>
        <text x="700" y="512" text-anchor="middle" fill="#E6EBEE" font-weight="600" font-size="12.5">③ Report Writer</text>
        <text x="700" y="529" text-anchor="middle" fill="#93A0A7" font-size="10">renders Markdown</text>

        <path d="M548,434 H500" marker-end="url(#g1b)" fill="none" stroke="#4DBCB1" stroke-width="1.4" stroke-dasharray="5 4"/>
        <rect x="492" y="415" width="64" height="13" fill="#222A2F" stroke="none"/><text x="524" y="424" text-anchor="middle" font-size="9" fill="#4DBCB1">Jev as a tool</text>

        <path d="M700,556 V584" marker-end="url(#g1a)" fill="none" stroke="#93A0A7" stroke-width="1.4"/>
        <rect x="640" y="588" width="120" height="40" rx="4" fill="#222A2F" stroke="#354047" stroke-width="1.3"/>
        <text x="700" y="613" text-anchor="middle" font-size="11" fill="#E6EBEE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">report.md</text>
      </g>
</svg>
